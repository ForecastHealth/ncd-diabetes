# Configuration for Diabetes D1 Scenario
metadata:
  label: "Appendix 3 - D1 Scenario"
  description: |
    Comprehensive foot care intervention to prevent lower extremity amputations in people with diabetes.
    This scenario exposes the parameters for neuropathy screening and foot care programs that work by early detection and management of diabetic neuropathy complications.
    The intervention reduces progression from diabetes to lower extremity amputation by providing educational programs, access to appropriate footwear, and multidisciplinary clinic care.
    Neuropathy screening identifies at-risk individuals with diabetic nerve damage who require enhanced foot care, with a target population in need of 66% of diabetic patients.
    The intervention includes systematic foot examinations, patient education on foot care practices, provision of therapeutic footwear, and coordinated care through specialized clinics.
    This intervention is particularly effective in preventing costly and debilitating amputations while improving quality of life for people with diabetes.
    Note: This intervention should be implemented alongside other diabetes care interventions for comprehensive management of diabetes complications.
  authors: []

# Components to include (from build/components/)
components:
  - diabetes_base.json
  - diabetes_foot_care.json

# Override specific values for D1 scenario
overrides:
  "Neuropathy Screening Target Coverage":
    value: 0.95

# Output file path (relative to build directory)
output: ../scenarios/diabetes_d1.json