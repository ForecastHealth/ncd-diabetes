# Configuration for Unhealthy Diet - Fiber Procurement
metadata:
  label: "Appendix 3 - Unhealthy Diet Fiber Procurement Scenario"
  description: |
    Fiber procurement intervention that modifies coverage of public procurement policies.
    This scenario changes coverage parameters to increase total fiber intake in grams.
    The increased fiber intake modifies the relative risk through an impact calculation, which affects diabetes incidence rates.
  authors: []

# Components to include (from build/components/)
components:
  - diabetes_base.json
  - unhealthy_diet_fiber_procurement.json

# Optional: Override specific parameter values
# These will be applied after merging components
overrides: {}

# Output file path (relative to build directory)
output: ../scenarios/unhealthy_diet_fiber_procurement.json
