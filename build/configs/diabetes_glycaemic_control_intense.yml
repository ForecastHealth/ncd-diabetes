# Configuration for Intensive Glycaemic Control Only
metadata:
  label: "Clinical Intervention - Intensive Glycaemic Control"
  description: |
    Intensive glycaemic control intervention for people with diabetes to prevent microvascular complications.
    This intervention works by maintaining optimal blood glucose levels through intensive medication management and glucose monitoring.
    The intervention reduces progression from diabetes to diabetic nephropathy, retinopathy, and other complications by providing intensive glucose control for patients requiring more aggressive management.
  authors: []

# Components to include
components:
  - diabetes_base.json
  - diabetes_glycaemic_control_intense.json

# No overrides needed for clinical intervention
overrides: {}

output: ../scenarios/diabetes_glycaemic_control_intense.json
