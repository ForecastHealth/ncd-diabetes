# Configuration for Physical Inactivity P2 Scenario
metadata:
  label: "Appendix 3 - Physical Inactivity P2 Scenario"
  description: |
    Physical activity awareness intervention that increases coverage of mass media campaigns.
    This scenario modifies coverage parameters from baseline to target levels over a specified scale-up period.
    The intervention reduces prevalence of physical inactivity, which changes the population attributable fraction and subsequently affects diabetes incidence rates.
  authors: []

# Components to include (from build/components/)
components:
  - physical_inactivity_p2.json

# Optional: Override specific parameter values
# These will be applied after merging components
overrides: {}

# Output file path (relative to build directory)
output: ../scenarios/physical_inactivity_p2.json