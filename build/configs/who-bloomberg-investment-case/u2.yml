# Configuration for U2 Scenario
metadata:
  label: "U2 - Supportive environment in public institutions"
  description: |
    Reduce nutrient intake (incl. salt) through the establishment of a supportive environment in public institutions such as hospitals, schools, workplaces and nursing homes, to enable lower sodium options to be provided.
    This intervention targets institutional procurement for fiber content.
  authors: []

# Components to include (from build/components/)
components:
  - diabetes_base.json
  - runtime.json
  - unhealthy_diet_fiber_procurement.json

# Override specific values for U2 scenario
overrides:
  "Start Year":
    value: 2025
  "End Year":
    value: 2051
  "Target Coverage Fiber Procurement":
    value: 0.95
  "Scale-Up Final Year Fiber Procurement":
    value: 3

# Output file path (relative to build directory)
output: ../scenarios/who-bloomberg-investment-case/u2.json
