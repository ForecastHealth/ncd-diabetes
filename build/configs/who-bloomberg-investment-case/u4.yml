# Configuration for U4 Scenario
metadata:
  label: "U4 - Front-of-pack labelling"
  description: |
    Reduce nutrient intake (incl. salt) through the implementation of front-of-pack labelling.
    This intervention targets consumer information through improved food labelling for fiber content.
  authors: []

# Components to include (from build/components/)
components:
  - diabetes_base.json
  - runtime.json
  - unhealthy_diet_fiber_relabelling.json

# Override specific values for U4 scenario
overrides:
  "Start Year":
    value: 2025
  "End Year":
    value: 2051
  "Target Coverage Fiber Relabelling":
    value: 0.95
  "Scale-Up Final Year Fiber Relabelling":
    value: 3

# Output file path (relative to build directory)
output: ../scenarios/who-bloomberg-investment-case/u4.json
