# Configuration for Diabetes D2 Scenario
metadata:
  label: "Appendix 3 - D2 Scenario"
  description: |
    Comprehensive diabetic retinopathy screening and treatment intervention to prevent blindness in people with diabetes.
    This scenario exposes the parameters for retinopathy screening programs and laser photocoagulation treatments that work by early detection and management of diabetic eye complications.
    The intervention reduces progression from diabetes to diabetic retinopathy and blindness by providing systematic eye examinations and timely laser treatment for all diabetes patients.
    Retinopathy screening identifies diabetic patients with early eye damage who require laser photocoagulation treatment, with a target population in need of 33% of diabetic patients.
    The intervention includes regular ophthalmologic examinations, retinal photography screening, and laser photocoagulation therapy to prevent vision loss and blindness.
    This intervention is highly cost-effective in preventing irreversible vision loss and maintaining quality of life for people with diabetes.
    Note: This intervention should be implemented alongside other diabetes care interventions for comprehensive management of diabetes complications.
  authors: []

# Components to include (from build/components/)
components:
  - diabetes_base.json
  - diabetes_retinopathy_screening.json

# Override specific values for D2 scenario
overrides:
  "Retinopathy Screening Target Coverage":
    value: 0.95

# Output file path (relative to build directory)
output: ../scenarios/diabetes_d2.json
