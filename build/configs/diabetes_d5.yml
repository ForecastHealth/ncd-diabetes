# Configuration for Diabetes D5 Scenario
metadata:
  label: "Appendix 3 - D5 Scenario"
  description: |
    Comprehensive blood pressure control intervention for people with diabetes to prevent cardiovascular and microvascular complications.
    This scenario exposes the parameters for nephropathy screening and blood pressure management programs that work by early detection of kidney disease and systematic hypertension control.
    The intervention reduces progression from diabetes to diabetic nephropathy and other cardiovascular complications by providing regular blood pressure monitoring, antihypertensive medications, and nephropathy screening.
    Nephropathy screening identifies diabetic patients with early kidney damage who require enhanced blood pressure control, with a target population in need of 33% of diabetic patients.
    The intervention includes regular blood pressure measurement, medication management with ACE inhibitors or ARBs, urine protein testing, and coordinated care to prevent kidney disease progression.
    This intervention is critical for preventing both cardiovascular events and kidney failure in people with diabetes, addressing two major causes of morbidity and mortality.
    Note: This intervention should be implemented alongside other diabetes care interventions for comprehensive management of diabetes complications.
  authors: []

# Components to include (from build/components/)
components:
  - diabetes_base.json
  - diabetes_blood_pressure_control.json

# Optional: Override specific parameter values
# These will be applied after merging components
overrides: {}

# Output file path (relative to build directory)
output: ../scenarios/diabetes_d5.json