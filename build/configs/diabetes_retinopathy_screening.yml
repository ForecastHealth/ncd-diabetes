metadata:
  label: "Clinical Intervention - Diabetic Retinopathy Screening"
  description: |
    Comprehensive diabetic retinopathy screening and treatment intervention to prevent blindness in people with diabetes.
    This intervention reduces progression from diabetes to diabetic retinopathy and blindness by providing systematic eye examinations and timely laser treatment.
    Retinopathy screening identifies diabetic patients with early eye damage who require laser photocoagulation treatment.
